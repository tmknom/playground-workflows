version: 2

project_name: playground-workflows

builds:
  - id: cli
    main: .
    binary: playground-workflows
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: distributions
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true
