# Go CLI のリリース用ビルドを、プルリクエストの段階でテストするワークフロー。
#
# release.yml の build ジョブと同じビルドと確認を、公開せずにスナップショットとして実行する。
# GoReleaser の設定、GoReleaser と Syft の固定、Go のクロスコンパイル、配布するバイナリと SBOM を、マージ前に確かめる。
#
# このワークフローが要るのは、リリース用ビルドを試す場所がほかにないためである。
#   - release.yml は main 上のタグでしか先へ進まないため、プルリクエストのブランチでは試せない
#   - GoReleaser はローカルにインストールしない方針のため、手元でも試せない
# これがないと、.goreleaser.yaml などの誤りにはマージ後のリリースで初めて気付き、修正とタグの付け直しが要る。
#
# build ジョブの処理を複製しているため、次の値と確認は release.yml の build ジョブと同じにし、変えるときは両方を変える。
#   - GoReleaser と Syft のバージョンとハッシュ
#   - 配布するバイナリと SBOM の収集と確認（Collect assets と Verify assets）
name: Test Release Build
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/test-release-build.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# APP_NAME は、次の箇所と同じ値にする。変えるときは、すべてを同時に変える。
#   - .github/workflows/release.yml の APP_NAME
#   - .goreleaser.yaml の project_name
env:
  APP_NAME: playground-workflows

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # GoReleaser がタグからスナップショットのバージョンを決めるため、すべての履歴とタグを取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # GoReleaser と Syft は、release.yml の build ジョブと同じバージョンとハッシュで固定してインストールする
      - name: Set up GoReleaser
        env:
          GORELEASER_VERSION: 2.20.2
          GORELEASER_SHA256: f3d24969a7389a46613875711d15a96d8f6ef1553d84c6ace09d69ac1e7d44c0
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/goreleaser_${GORELEASER_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' -o "${archive}" \
            "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/goreleaser"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/goreleaser" goreleaser
          echo "${RUNNER_TEMP}/goreleaser" >> "${GITHUB_PATH}"

      # GoReleaser が SBOM の生成に呼び出す Syft を入れる
      - name: Set up Syft
        env:
          SYFT_VERSION: 1.57.1
          SYFT_SHA256: bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' -o "${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "${GITHUB_PATH}"

      - name: Build snapshot
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          goreleaser --version
          syft version
          goreleaser check
          goreleaser release --snapshot --clean

      # release.yml の build ジョブの Collect assets と同じ方法で、配布名のファイルを集める
      - name: Collect assets
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          mkdir "${assets}"
          cp dist/SHA256SUMS "${assets}/"
          for name in $(awk '{print $2}' dist/SHA256SUMS); do
            path="$(jq -r --arg name "${name}" \
              '[.[] | select(.name == $name) | .path] | unique |
                if length == 1 then .[0] else error("\(length) paths found for \($name)") end' \
              dist/artifacts.json)"
            cp "${path}" "${assets}/${name}"
          done
          ls -l "${assets}"

      # release.yml の build ジョブの Verify assets と同じ確認で、リリース前に PR で誤りを検出する。
      # バージョンはタグではなく、GoReleaser が決めたスナップショットのバージョンを使う
      - name: Verify assets
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          version_number="$(jq -r .version "${GITHUB_WORKSPACE}/dist/metadata.json")"
          echo "version: ${version_number}"
          prefix="${APP_NAME}_${version_number}_"
          binaries="$(printf "${prefix}%s\n" \
            darwin_amd64 darwin_arm64 \
            linux_amd64 linux_arm64 \
            windows_amd64.exe windows_arm64.exe | sort)"
          sboms="$(sed 's/$/.sbom.json/' <<< "${binaries}")"
          expected_listed="$(printf '%s\n' ${binaries} ${sboms} | sort)"
          listed="$(awk '{print $2}' SHA256SUMS | sort)"
          if [[ "${listed}" != "${expected_listed}" ]]; then
            echo "::error::SHA256SUMS does not list exactly the six binaries and six SBOMs"
            diff <(echo "${expected_listed}") <(echo "${listed}") || true
            exit 1
          fi

          for file in ${binaries}; do
            target="${file#"${prefix}"}"
            target="${target%.exe}"
            arch="${target#*_}"
            case "${arch}" in
              amd64) level=GOAMD64=v1 ;;
              arm64) level=GOARM64=v8.0 ;;
            esac
            settings="$(go version -m "${file}" | awk '$1 == "build" {print $2}')"
            for want in "GOOS=${target%_*}" "GOARCH=${arch}" CGO_ENABLED=0 "${level}"; do
              if ! grep -qx "${want}" <<< "${settings}"; then
                echo "::error::${file} was not built with ${want}"
                echo "${settings}"
                exit 1
              fi
            done
          done

          for file in ${binaries}; do
            digest="$(sha256sum "${file}" | awk '{print $1}')"
            if ! jq -e --arg name "${file}" --arg digest "${digest}" \
              '(.spdxVersion | startswith("SPDX-")) and .name == $name and
                any(.packages[]; .name == $name and any(.checksums[]?; .algorithm == "SHA256" and .checksumValue == $digest))' \
              "${file}.sbom.json" > /dev/null; then
              echo "::error::${file}.sbom.json does not describe ${file}"
              exit 1
            fi
          done

          actual="$("./${APP_NAME}_${version_number}_linux_amd64" --version)"
          if [[ "${actual}" != "${version_number}" ]]; then
            echo "::error::--version printed ${actual}, but ${version_number} is expected"
            exit 1
          fi
          echo "linux_amd64 --version: ${actual}"

          expected="$(printf '%s\n' ${expected_listed} SHA256SUMS | sort)"
          files="$(find . -type f -printf '%P\n' | sort)"
          if [[ "${files}" != "${expected}" ]]; then
            echo "::error::The collected files do not match the six binaries, six SBOMs, and SHA256SUMS"
            diff <(echo "${expected}") <(echo "${files}") || true
            exit 1
          fi
          sha256sum -c SHA256SUMS
          echo "All checks passed"
