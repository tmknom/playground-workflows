name: Release Go CLI
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

# Lambda のリリースと同じグループにして、バージョンの計算と公開を重ねない
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # リリースできない状態のタグでは、テストやビルドの前に止める
  preflight:
    # 再実行では actor が最初の実行者のまま変わらないため、再実行した者も triggering_actor で確かめる
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # パッケージは Public のため、GHCR へのログインと packages: read は要らない
    permissions:
      contents: read
    steps:
      # main の履歴と比べるため、すべての履歴を取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # git merge-base --is-ancestor は、祖先でなければ 1 を、origin/main がないなどの失敗では 128 を返す。
      # 失敗を「main にない」と報告しないよう、終了コードで分ける
      - name: Verify tag
        run: |
          set -euo pipefail
          status=0
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || status=$?
          if [[ "${status}" -eq 1 ]]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          elif [[ "${status}" -ne 0 ]]; then
            echo "::error::git merge-base failed with exit code ${status}"
            exit 1
          fi
          echo "The tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA} on main"

      # 存在しない場合も、認証や通信の障害でも終了コードは 1 になるため、エラーメッセージで「存在しない」を判定する。
      # それ以外の失敗は、確認できなかったものとして止める
      - name: Verify no release exists
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if err="$(gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" 2>&1 > /dev/null)"; then
            echo "::error::The release ${VERSION} already exists"
            exit 1
          fi
          if [[ "${err}" != "release not found" ]]; then
            echo "::error::Could not check the release ${VERSION}: ${err}"
            exit 1
          fi
          echo "The release ${VERSION} does not exist"

      # 匿名では、存在しないパッケージも not found になるため、非公開のパッケージのタグも検出できない可能性がある。
      # パッケージは Public である前提で運用する
      - name: Verify no image exists
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          if err="$(docker buildx imagetools inspect "${ref}" 2>&1 > /dev/null)"; then
            echo "::error::The image tag ${VERSION} already exists"
            exit 1
          fi
          if [[ "${err}" != "ERROR: ${ref}: not found" ]]; then
            echo "::error::Could not check the image tag ${VERSION}: ${err}"
            exit 1
          fi
          echo "The image tag ${VERSION} does not exist"

  test:
    needs: [preflight]
    # 「Re-run failed jobs」では成功済みのジョブの if が評価し直されないため、権限を持つジョブを守るよう全ジョブに同じ条件を置く
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go vet ./...
          go test -count=1 ./...

  build:
    needs: [test]
    # 「Re-run failed jobs」では成功済みのジョブの if が評価し直されないため、権限を持つジョブを守るよう全ジョブに同じ条件を置く。
    # build 自体は読み取り専用で、この条件がなくても公開には届かない
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # GoReleaser がタグからバージョンを決めるため、すべての履歴とタグを取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true

      # GoReleaser が SBOM の生成に呼び出す Syft を入れる。
      # Action を使うと Action のコードは固定できても、実行時に取得する Syft は固定できないため、アーカイブの SHA-256 で固定する。
      # 版とハッシュは verify-goreleaser.yml と同じ値にする
      - name: Set up Syft
        env:
          SYFT_VERSION: 1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' -o "${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "${GITHUB_PATH}"

      # 同じコミットに複数のタグがあると GoReleaser は最も大きいバージョンを選ぶため、起動したタグを明示する
      - name: Build
        env:
          GOTOOLCHAIN: local
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          syft version
          goreleaser check
          goreleaser release --clean --skip=publish,announce

      # アーカイブと SBOM の過不足、バージョンの食い違い、SHA256SUMS への想定外の記載、アーカイブの中身の誤りを検出する。
      # バイナリの実行を照合より前に済ませ、照合の後はアップロードだけにする
      - name: Verify archives
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf "playground-workflows_${version}_%s\n" \
            darwin_amd64.tar.gz darwin_arm64.tar.gz \
            linux_amd64.tar.gz linux_arm64.tar.gz \
            windows_amd64.zip windows_arm64.zip | sort)"
          expected_sboms="$(sed 's/$/.sbom.json/' <<< "${expected}")"
          expected_listed="$(printf '%s\n' ${expected} ${expected_sboms} | sort)"
          archives="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)"
          sboms="$(find . -maxdepth 1 -type f -name '*.sbom.json' -printf '%f\n' | sort)"
          listed="$(awk '{print $2}' SHA256SUMS | sort)"
          if [[ "${archives}" != "${expected}" ]]; then
            echo "::error::Archives in dist/ do not match the expected six archives"
            diff <(echo "${expected}") <(echo "${archives}") || true
            exit 1
          fi
          if [[ "${sboms}" != "${expected_sboms}" ]]; then
            echo "::error::SBOMs in dist/ do not match the expected six SBOMs"
            diff <(echo "${expected_sboms}") <(echo "${sboms}") || true
            exit 1
          fi
          if [[ "${listed}" != "${expected_listed}" ]]; then
            echo "::error::SHA256SUMS does not list exactly the six archives and six SBOMs"
            diff <(echo "${expected_listed}") <(echo "${listed}") || true
            exit 1
          fi

          # 各アーカイブの直下に、バイナリと LICENSE だけがあることと、tar.gz のバイナリに実行権限があることを確かめる。
          # 実行権限はバイナリの存在を確かめてから調べる。バイナリがないと tar が失敗し、原因がわかりにくくなるため
          for archive in ${expected}; do
            if [[ "${archive}" == *.zip ]]; then
              entries="$(unzip -Z1 "${archive}" | sort)"
              want="$(printf '%s\n' LICENSE playground-workflows.exe)"
            else
              entries="$(tar -tzf "${archive}" | sort)"
              want="$(printf '%s\n' LICENSE playground-workflows)"
            fi
            if [[ "${entries}" != "${want}" ]]; then
              echo "::error::Unexpected entries in ${archive}"
              echo "${entries}"
              exit 1
            fi
            if [[ "${archive}" == *.tar.gz ]]; then
              mode="$(tar -tvzf "${archive}" playground-workflows | awk '{print $1}')"
              if [[ "${mode}" != -rwx* ]]; then
                echo "::error::playground-workflows in ${archive} is not executable: ${mode}"
                exit 1
              fi
            fi
          done

          # 各 SBOM が SPDX の JSON として読め、対象のアーカイブの名前と SHA-256 を記録していることを確かめる。
          # SBOM の中身の正確さまでは確かめない
          for archive in ${expected}; do
            digest="$(sha256sum "${archive}" | awk '{print $1}')"
            if ! jq -e --arg name "${archive}" --arg digest "${digest}" \
              '(.spdxVersion | startswith("SPDX-")) and .name == $name and
                any(.packages[]; .name == $name and any(.checksums[]?; .algorithm == "SHA256" and .checksumValue == $digest))' \
              "${archive}.sbom.json" > /dev/null; then
              echo "::error::${archive}.sbom.json does not describe ${archive}"
              exit 1
            fi
          done

          # ldflags は全ターゲットで共通の設定のため、runner と同じ linux_amd64 の1件で埋め込みを確かめる。
          # dist/ を汚さないよう、展開先は dist/ の外にする
          extract="${RUNNER_TEMP}/linux_amd64"
          mkdir -p "${extract}"
          tar -xzf "playground-workflows_${version}_linux_amd64.tar.gz" -C "${extract}"
          actual="$("${extract}/playground-workflows" --version)"
          if [[ "${actual}" != "${version}" ]]; then
            echo "::error::--version printed ${actual}, but ${version} is expected"
            exit 1
          fi
          echo "linux_amd64 --version: ${actual}"

          sha256sum -c SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # GoReleaser やビルド中に動くコードに OIDC の権限を渡さないよう、署名は Checkout もビルドもしない別ジョブで行う
  attest:
    needs: [build]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # artifact-metadata: write は、レジストリに push するときの storage record にだけ要るため与えない
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # 署名する digest が、後続のジョブが公開する Artifact のアーカイブと SBOM に一致することを確かめる
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum -c SHA256SUMS

      # predicate を渡さないと、SLSA Build Provenance の Attestation を作る。
      # subject は SHA256SUMS に列挙されたアーカイブと SBOM で、SHA256SUMS 自体は含まれない
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS

  # GHCR への公開は取り消しにくいため、来歴の署名が成功してから行う
  container:
    needs: [build, attest]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # レジストリへ Attestation を保存するには packages: write が要るため、イメージの署名は別ジョブにせずここで行う。
    # artifact-metadata: write は storage record にだけ要るため与えない
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Dockerfile だけを取得する。リポジトリのコードは実行しない
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # ビルドコンテキストには、配布アーカイブから取り出した Linux バイナリだけを置く
      - name: Prepare build context
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          for arch in amd64 arm64; do
            mkdir -p "${RUNNER_TEMP}/context/${arch}"
            tar -xzf "playground-workflows_${GITHUB_REF_NAME#v}_linux_${arch}.tar.gz" \
              -C "${RUNNER_TEMP}/context/${arch}" playground-workflows
          done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ビルドの記録を Actions Artifact として残さない。ジョブ間で受け渡す Artifact は release-assets だけにする
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ runner.temp }}/context
          file: ${{ github.workspace }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      # subject はタグではなく Image Index の digest にする。タグは付け替えられるため
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # GHCR に公開したイメージを digest で取得し、runner の CPU ごとに検証する。
  # Image Index から runner の CPU に合うイメージが選ばれるため、amd64 と arm64 の runner で1回ずつ実行する
  verify-image:
    needs: [container]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # パッケージは Public のため、GHCR へのログインと packages: read は要らない。
    # attestations: read は、gh attestation verify が GitHub の Attestation API から取得するのに要る
    permissions:
      attestations: read
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Verify image
        working-directory: ${{ runner.temp }}/release-assets
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256sum -c SHA256SUMS
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image digest is not in the form of sha256:<hex>"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"

          # QEMU によるエミュレーションで別の CPU のイメージを確かめないよう、runner の CPU が matrix の arch と一致することを確かめる
          host="$(docker version --format '{{.Server.Arch}}')"
          if [[ "${host}" != "${ARCH}" ]]; then
            echo "::error::The runner is ${host}, but ${ARCH} is expected"
            exit 1
          fi

          # イメージを実行する前に、来歴とバイナリを確かめる。
          # 検証するのは Image Index の digest である。プラットフォーム別のマニフェストには Attestation がない。
          # gh attestation verify は TTY がないと成功しても何も出力しないため、結果を出力する
          gh attestation verify "oci://${image}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-go-cli.yml" \
            --signer-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners
          echo "Attestation verified: ${image}"

          # イメージ内のバイナリが、配布アーカイブ内のバイナリとバイト単位で一致することを確かめる。
          # 実行ユーザーは、プラットフォームを指定して作ったコンテナの設定から読む
          cid="$(docker create --platform "linux/${ARCH}" "${image}")"
          docker cp "${cid}:/usr/local/bin/playground-workflows" "${RUNNER_TEMP}/from-image"
          user="$(docker container inspect --format '{{.Config.User}}' "${cid}")"
          docker rm "${cid}"
          mkdir "${RUNNER_TEMP}/from-archive"
          tar -xzf "playground-workflows_${version}_linux_${ARCH}.tar.gz" \
            -C "${RUNNER_TEMP}/from-archive" playground-workflows
          cmp "${RUNNER_TEMP}/from-image" "${RUNNER_TEMP}/from-archive/playground-workflows"
          echo "linux_${ARCH} binary matches the archive"
          if [[ "${user}" != "nonroot:nonroot" ]]; then
            echo "::error::The image runs as ${user}, but nonroot:nonroot is expected"
            exit 1
          fi

          got="$(docker run --rm --platform "linux/${ARCH}" "${image}" --version)"
          if [[ "${got}" != "${version}" ]]; then
            echo "::error::--version printed ${got}, but ${version} is expected"
            exit 1
          fi
          echo "linux_${ARCH} image --version: ${got}"

  # GitHub Release の公開は正式リリースの完了点のため、GHCR に公開したイメージの検証が成功してから行う
  release:
    needs: [attest, container, verify-image]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # attestations: read は、gh attestation verify が GitHub の Attestation API から取得するのに要る
    permissions:
      contents: write
      attestations: read
    steps:
      # contents: write を持つため Checkout せず、受け取ったファイルをデータとして登録するだけにする
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # SHA256SUMS との照合だけでは、アーカイブと SHA256SUMS が一緒に差し替えられた場合を検出できないため、
      # 公開するアーカイブと SBOM が、このワークフローによって同じコミットとタグで署名されたものであることを確かめる。
      # 対象は Publish release が登録するのと同じ、SHA256SUMS に列挙されたファイルである
      - name: Verify assets
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 列挙が空だと検証が1回も走らずに成功し、重複があると別のファイルが欠けるため、
          # 期待するアーカイブ 6 件と SBOM 6 件に一致することを確かめる
          version="${GITHUB_REF_NAME#v}"
          archives="$(printf "playground-workflows_${version}_%s\n" \
            darwin_amd64.tar.gz darwin_arm64.tar.gz \
            linux_amd64.tar.gz linux_arm64.tar.gz \
            windows_amd64.zip windows_arm64.zip)"
          sboms="$(sed 's/$/.sbom.json/' <<< "${archives}")"
          expected="$(printf '%s\n' ${archives} ${sboms} | sort)"
          listed="$(awk '{print $2}' SHA256SUMS | sort)"
          if [[ "${listed}" != "${expected}" ]]; then
            echo "::error::SHA256SUMS does not list exactly the six archives and six SBOMs"
            diff <(echo "${expected}") <(echo "${listed}") || true
            exit 1
          fi
          sha256sum -c SHA256SUMS

          # gh attestation verify はファイルの digest だけで Attestation を照合するため、
          # 署名された subject の名前もファイル名と一致することを確かめ、ファイル同士の中身の入れ替えを検出する。
          # 成功しても何も出力しないため、結果を出力する
          for file in ${expected}; do
            digest="$(sha256sum "${file}" | awk '{print $1}')"
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-go-cli.yml" \
              --signer-digest "${GITHUB_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners \
              --format json |
              jq -e --arg name "${file}" --arg digest "${digest}" \
                'any(.[].verificationResult.statement.subject[]; .name == $name and .digest.sha256 == $digest)' > /dev/null
            echo "Attestation verified: ${file}"
          done

      # 登録するのは、Verify assets で照合と来歴の検証をしたアーカイブと SBOM、SHA256SUMS、container-image.txt だけにする。
      # --verify-tag はタグがなければ失敗させ、gh がタグを新しく作ることを防ぐ。
      # タグがあれば --target は使われないため、タグの付け替えは検出できない。
      # 同じバージョンの Release があれば gh release create が失敗し、既存の Release は書き換えない
      - name: Publish release
        working-directory: ${{ runner.temp }}/release-assets
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image digest is not in the form of sha256:<hex>"
            exit 1
          fi
          echo "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}" > container-image.txt
          # プロセス置換の失敗は set -e で止まらないため、件数を確かめてから公開する
          mapfile -t files < <(awk '{print $2}' SHA256SUMS)
          if [[ "${#files[@]}" -ne 12 ]]; then
            echo "::error::SHA256SUMS lists ${#files[@]} files, but 12 are expected"
            exit 1
          fi
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --target "${GITHUB_SHA}" \
            --title "${VERSION}" --generate-notes "${files[@]}" SHA256SUMS container-image.txt

  # 公開した GitHub Release と GHCR のイメージを取得し直し、正規の成果物と照合する。このジョブの成功をもってリリースの完了とする。
  # 失敗した時点で Release は公開済みだが、自動では取り消さない
  post-verify:
    needs: [container, release]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # パッケージは Public のため、GHCR へのログインと packages: read は要らない。
    # attestations: read は、gh attestation verify が GitHub の Attestation API から取得するのに要る
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Verify release
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="${RUNNER_TEMP}/release-assets"
          published="${RUNNER_TEMP}/published"
          image="ghcr.io/${GITHUB_REPOSITORY}"

          # Release が公開済みで、タグがビルドしたコミットを指したままである。
          # コミットの API に refs/tags/ 付きの ref を渡すと、軽量タグでも注釈付きタグでも、指しているコミットの SHA が得られる。
          # タグ名だけを渡さないのは、同じ名前のブランチがあると参照先が曖昧になるため
          draft="$(gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [[ "${draft}" != "false" ]]; then
            echo "::error::The release ${VERSION} is still a draft"
            exit 1
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${VERSION}" --jq .sha)"
          if [[ "${sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The tag ${VERSION} points to ${sha}, but ${GITHUB_SHA} is expected"
            exit 1
          fi
          echo "The release ${VERSION} is published and the tag points to ${sha}"

          # 公開された資産が、正規の成果物に release と同じ方法で作った container-image.txt を加えたものと過不足なく一致する
          echo "${image}@${IMAGE_DIGEST}" > "${expected}/container-image.txt"
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir "${published}"
          diff -r "${expected}" "${published}"
          echo "Release assets match the canonical artifacts:"
          ls -1 "${published}"

          # GHCR のバージョンタグが、container-image.txt に記録した digest を指している
          got="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
          if [[ "${got}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::${image}:${VERSION} points to ${got}, but ${IMAGE_DIGEST} is expected"
            exit 1
          fi
          echo "${image}:${VERSION} points to ${got}"

          # 公開された資産から、利用者と同じ手順で来歴を検証できる。
          # 資産の名前は diff -r で照合済みのため、subject の名前は確かめない。
          # gh attestation verify は TTY がないと成功しても何も出力しないため、結果を出力する
          cd "${published}"
          for file in ./*.tar.gz ./*.zip ./*.sbom.json; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-go-cli.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners
            echo "Attestation verified: ${file#./}"
          done
          gh attestation verify "oci://$(cat container-image.txt)" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-go-cli.yml" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners
          echo "Attestation verified: $(cat container-image.txt)"
