name: Release Go CLI
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

# Lambda のリリースと同じグループにして、バージョンの計算と公開を重ねない
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    # 再実行では actor が最初の実行者のまま変わらないため、再実行した者も triggering_actor で確かめる
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go vet ./...
          go test -count=1 ./...
