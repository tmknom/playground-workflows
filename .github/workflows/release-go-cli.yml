name: Release Go CLI
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

# Lambda のリリースと同じグループにして、バージョンの計算と公開を重ねない
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    # 再実行では actor が最初の実行者のまま変わらないため、再実行した者も triggering_actor で確かめる
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go vet ./...
          go test -count=1 ./...

  build:
    needs: [test]
    # 「Re-run failed jobs」では成功済みのジョブの if が評価し直されないため、権限を持つジョブを守るよう全ジョブに同じ条件を置く。
    # build 自体は読み取り専用で、この条件がなくても公開には届かない
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # GoReleaser がタグからバージョンを決めるため、すべての履歴とタグを取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true

      # 同じコミットに複数のタグがあると GoReleaser は最も大きいバージョンを選ぶため、起動したタグを明示する
      - name: Build
        env:
          GOTOOLCHAIN: local
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          goreleaser check
          goreleaser release --clean --skip=publish,announce

      # アーカイブの過不足、バージョンの食い違い、SHA256SUMS への想定外の記載を検出する
      - name: Verify archives
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf "playground-workflows_${version}_%s\n" \
            darwin_amd64.tar.gz darwin_arm64.tar.gz \
            linux_amd64.tar.gz linux_arm64.tar.gz \
            windows_amd64.zip windows_arm64.zip | sort)"
          archives="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)"
          listed="$(awk '{print $2}' SHA256SUMS | sort)"
          if [[ "${archives}" != "${expected}" ]]; then
            echo "::error::Archives in dist/ do not match the expected six archives"
            diff <(echo "${expected}") <(echo "${archives}") || true
            exit 1
          fi
          if [[ "${listed}" != "${expected}" ]]; then
            echo "::error::SHA256SUMS does not list exactly the six archives"
            diff <(echo "${expected}") <(echo "${listed}") || true
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # GoReleaser やビルド中に動くコードに OIDC の権限を渡さないよう、署名は Checkout もビルドもしない別ジョブで行う
  attest:
    needs: [build]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # artifact-metadata: write は、レジストリに push するときの storage record にだけ要るため与えない
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # 署名する digest が、後続のジョブが公開する Artifact のアーカイブと一致することを確かめる
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum -c SHA256SUMS

      # predicate を渡さないと、SLSA Build Provenance の Attestation を作る。
      # subject は SHA256SUMS に列挙されたアーカイブで、SHA256SUMS 自体は含まれない
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS

  # GHCR への公開は取り消しにくいため、来歴の署名が成功してから行う
  container:
    needs: [build, attest]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # レジストリへ Attestation を保存するには packages: write が要るため、イメージの署名は別ジョブにせずここで行う。
    # artifact-metadata: write は storage record にだけ要るため与えない
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Dockerfile だけを取得する。リポジトリのコードは実行しない
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # ビルドコンテキストには、配布アーカイブから取り出した Linux バイナリだけを置く
      - name: Prepare build context
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          for arch in amd64 arm64; do
            mkdir -p "${RUNNER_TEMP}/context/${arch}"
            tar -xzf "playground-workflows_${GITHUB_REF_NAME#v}_linux_${arch}.tar.gz" \
              -C "${RUNNER_TEMP}/context/${arch}" playground-workflows
          done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ビルドの記録を Actions Artifact として残さない。ジョブ間で受け渡す Artifact は release-assets だけにする
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ runner.temp }}/context
          file: ${{ github.workspace }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      # subject はタグではなく Image Index の digest にする。タグは付け替えられるため
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # GitHub Release の公開は正式リリースの完了点のため、GHCR への公開と署名が成功してから行う
  release:
    needs: [attest, container]
    if: ${{ github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # contents: write を持つため Checkout せず、受け取ったファイルをデータとして登録するだけにする
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # 登録するのは、SHA256SUMS で照合したアーカイブ、SHA256SUMS、container-image.txt だけにする。
      # --verify-tag はタグがなければ失敗させ、gh がタグを新しく作ることを防ぐ。
      # タグがあれば --target は使われないため、タグの付け替えは検出できない。
      # 同じバージョンの Release があれば gh release create が失敗し、既存の Release は書き換えない
      - name: Publish release
        working-directory: ${{ runner.temp }}/release-assets
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image digest is not in the form of sha256:<hex>"
            exit 1
          fi
          echo "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}" > container-image.txt
          mapfile -t archives < <(awk '{print $2}' SHA256SUMS)
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --target "${GITHUB_SHA}" \
            --title "${VERSION}" --generate-notes "${archives[@]}" SHA256SUMS container-image.txt
