name: Verify GoReleaser
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/verify-goreleaser.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# GoReleaser はローカルにインストールせず、設定の確認はこのワークフローで行う。
# スナップショットビルドで、配布アーカイブ 6 件と SHA256SUMS が期待どおりに生成されることを確かめる
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # GoReleaser がタグからスナップショットのバージョンを決めるため、すべての履歴とタグを取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true

      - name: Build snapshot
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          goreleaser --version
          goreleaser check
          goreleaser release --snapshot --clean

      - name: Verify archives
        working-directory: dist
        run: |
          set -euo pipefail
          version="$(jq -r .version metadata.json)"
          echo "version: ${version}"

          # アーカイブの過不足と、SHA256SUMS に想定外のファイルが混ざっていないことを確かめる
          expected="$(printf "playground-workflows_${version}_%s\n" \
            darwin_amd64.tar.gz darwin_arm64.tar.gz \
            linux_amd64.tar.gz linux_arm64.tar.gz \
            windows_amd64.zip windows_arm64.zip | sort)"
          archives="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)"
          listed="$(awk '{print $2}' SHA256SUMS | sort)"
          if [[ "${archives}" != "${expected}" ]]; then
            echo "::error::Archives in dist/ do not match the expected six archives"
            diff <(echo "${expected}") <(echo "${archives}") || true
            exit 1
          fi
          if [[ "${listed}" != "${expected}" ]]; then
            echo "::error::SHA256SUMS does not list exactly the six archives"
            diff <(echo "${expected}") <(echo "${listed}") || true
            exit 1
          fi
          sha256sum -c SHA256SUMS

          # 各アーカイブの直下に、バイナリと LICENSE だけがあることと、tar.gz のバイナリに実行権限があることを確かめる。
          # release-go-cli.yml の build ジョブと同じ確認で、リリース前に PR で誤りを検出する
          for archive in ${expected}; do
            if [[ "${archive}" == *.zip ]]; then
              entries="$(unzip -Z1 "${archive}" | sort)"
              want="$(printf '%s\n' LICENSE playground-workflows.exe)"
            else
              entries="$(tar -tzf "${archive}" | sort)"
              want="$(printf '%s\n' LICENSE playground-workflows)"
            fi
            if [[ "${entries}" != "${want}" ]]; then
              echo "::error::Unexpected entries in ${archive}"
              echo "${entries}"
              exit 1
            fi
            if [[ "${archive}" == *.tar.gz ]]; then
              mode="$(tar -tvzf "${archive}" playground-workflows | awk '{print $1}')"
              if [[ "${mode}" != -rwx* ]]; then
                echo "::error::playground-workflows in ${archive} is not executable: ${mode}"
                exit 1
              fi
            fi
          done

          # runner と同じ OS / CPU のバイナリを実行し、埋め込んだバージョンを確かめる
          extract="${RUNNER_TEMP}/linux_amd64"
          mkdir -p "${extract}"
          tar -xzf "playground-workflows_${version}_linux_amd64.tar.gz" -C "${extract}"
          actual="$("${extract}/playground-workflows" --version)"
          if [[ "${actual}" != "${version}" ]]; then
            echo "::error::--version printed ${actual}, expected ${version}"
            exit 1
          fi
          echo "All checks passed"
